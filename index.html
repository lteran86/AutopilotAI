<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoPilot Social - AI Social Media Manager</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Meta / Facebook JavaScript SDK -->
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-effect {
            box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.25);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0d1322;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f293d;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // Meta Developer App ID
        const META_APP_ID = '1598454531681394';

        // Initial default posts
        const INITIAL_POSTS = [
            {
                id: 'post-1',
                platform: 'linkedin',
                postType: 'Thought Leadership',
                status: 'Scheduled',
                scheduledTime: 'Today, 2:30 PM',
                copy: "🚀 Scaling software shouldn't mean multiplying complexity. We analyzed how modern dev teams reduce pipeline friction by 40% using automated workflow orchestration.\n\nKey takeaways:\n1️⃣ Shift testing left with zero-config preview environments\n2️⃣ Automate dependency vulnerability patching\n3️⃣ Unify deployments under single-pane observability",
                hashtags: ['#DevOps', '#SoftwareEngineering', '#CloudArchitecture', '#TechInnovation', '#Productivity'],
                imageUrl: 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=800&q=80',
                imagePrompt: 'A sleek modern tech dashboard with dark mode UI, glowing data visualization graphs, isometric 3D render, minimalist cyan and violet lighting',
                engagementScore: '96% Reach Score',
                bestTime: 'Optimal (Peak Industry Traffic)',
                isGeneratingImage: false
            },
            {
                id: 'post-2',
                platform: 'instagram',
                postType: 'Product Showcase Carousel',
                status: 'Ready',
                scheduledTime: 'Tomorrow, 10:00 AM',
                copy: "Transform the way you build digital experiences. ✨\n\nOur platform connects directly into your existing stack, giving you real-time insights, automated workflow triggers, and instant brand scaling.\n\nTap the link in bio to start your free 14-day trial! 📲✨",
                hashtags: ['#DesignSystem', '#UIUX', '#WebDesign', '#TechTools', '#Automation', '#InstaTech'],
                imageUrl: 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=800&q=80',
                imagePrompt: 'Futuristic mobile device displaying holographic user interface floating above a dark desk, minimalist ambient lighting',
                engagementScore: '92% Reach Score',
                bestTime: 'Recommended',
                isGeneratingImage: false
            },
            {
                id: 'post-3',
                platform: 'tiktok',
                postType: 'Viral Hook & Script',
                status: 'Draft',
                scheduledTime: 'Thu, 6:00 PM',
                copy: "POV: You found the tool that does 5 hours of social media planning in 30 seconds. 🤯\n\nStop spending late nights writing post copy and designing graphics. Drop your site URL and let AI auto-generate your whole calendar.",
                hashtags: ['#TechTok', '#ProductivityHacks', '#MarketingTips', '#WorkSmarter', '#AITools'],
                imageUrl: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80',
                imagePrompt: '3D abstract glowing neon shapes floating in dark room, vibrant magenta and royal blue reflections, studio shot',
                engagementScore: '89% Reach Score',
                bestTime: 'High Engagement Window',
                isGeneratingImage: false
            },
            {
                id: 'post-4',
                platform: 'facebook',
                postType: 'Customer Success Story',
                status: 'Scheduled',
                scheduledTime: 'Friday, 11:15 AM',
                copy: "How Apex Labs doubled their organic engagement in 30 days without adding a single marketing headcount! 📈\n\nBy leveraging automated brand scanning, they delivered consistent, high-value industry content across all platforms effortlessly.",
                hashtags: ['#BusinessGrowth', '#MarketingStrategy', '#Automation', '#CustomerSuccess', '#ScaleUp'],
                imageUrl: 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=800&q=80',
                imagePrompt: 'Professional modern team collaborating around a high-tech conference desk with laptop screen glowing',
                engagementScore: '94% Reach Score',
                bestTime: 'Optimal',
                isGeneratingImage: false
            }
        ];

        function App() {
            const [urlInput, setUrlInput] = useState('https://stripe.com');
            const [isScanning, setIsScanning] = useState(false);
            const [scanStep, setScanStep] = useState(0);
            const [autoPilotActive, setAutoPilotActive] = useState(true);
            const [selectedPlatformFilter, setSelectedPlatformFilter] = useState('all');
            const [posts, setPosts] = useState(INITIAL_POSTS);
            const [activeTab, setActiveTab] = useState('queue'); // 'queue', 'strategy', 'accounts'
            const [toastMessage, setToastMessage] = useState(null);

            // Analyzed Brand State
            const [brandDossier, setBrandDossier] = useState({
                companyName: 'Stripe',
                domain: 'stripe.com',
                tagline: 'Financial infrastructure for the internet',
                audience: 'Developers, SaaS Founders, E-commerce Businesses, Enterprise Finance',
                tone: 'Authoritative, Clean, Developer-focused, Innovative',
                coreServices: ['Payment Processing', 'Billing & Subscriptions', 'Connect Marketplace Platform', 'Radar Fraud Protection'],
                citations: [
                    { title: 'Stripe Official Documentation & Services', uri: 'https://stripe.com' },
                    { title: 'Stripe Business Products & API', uri: 'https://stripe.com/products' }
                ]
            });

            // Social Accounts Connection States
            const [accounts, setAccounts] = useState({
                facebook: { connected: false, pageName: '', followers: '0', accessToken: null, id: null },
                instagram: { connected: false, handle: '', followers: '0', accessToken: null, id: null },
                linkedin: { connected: true, companyName: 'Stripe Inc.', followers: '512K' },
                tiktok: { connected: false, handle: '@stripe_official', followers: '24K' }
            });

            const [metaLoginStatus, setMetaLoginStatus] = useState('disconnected');
            const [showHttpsModal, setShowHttpsModal] = useState(false);
            const [manualAccessToken, setManualAccessToken] = useState('');

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            const copyToClipboard = (text) => {
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text);
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand('copy');
                    } catch (err) {
                        console.error('Fallback copy failed', err);
                    }
                    document.body.removeChild(textArea);
                }
                showToast('Copied to clipboard!');
            };

            const updatePostCopy = (id, newCopy) => {
                setPosts(prev => prev.map(p => p.id === id ? { ...p, copy: newCopy } : p));
            };

            const generateAIImageForPost = (id, prompt) => {
                const encodedPrompt = encodeURIComponent(prompt || 'modern minimal tech dashboard cyan purple');
                const newImgUrl = `https://pollinations.ai/p/${encodedPrompt}?width=800&height=450&seed=${Math.floor(Math.random() * 100000)}`;
                
                setTimeout(() => {
                    setPosts(prev => prev.map(p => p.id === id ? { ...p, imageUrl: newImgUrl, isGeneratingImage: false } : p));
                    showToast('Generated new AI visual graphic!');
                }, 1200);
            };

            const handleAnalyzeWebsite = async () => {
                if (!urlInput.trim()) {
                    showToast('Please enter a valid website URL.');
                    return;
                }

                let cleanUrl = urlInput.trim();
                if (!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://')) {
                    cleanUrl = 'https://' + cleanUrl;
                }

                let domainName = cleanUrl.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
                let companyDisplayName = domainName.split('.')[0];
                companyDisplayName = companyDisplayName.charAt(0).toUpperCase() + companyDisplayName.slice(1);

                setIsScanning(true);
                setScanStep(1);

                await new Promise(r => setTimeout(r, 800));
                setScanStep(2);

                await new Promise(r => setTimeout(r, 800));
                setScanStep(3);

                await new Promise(r => setTimeout(r, 800));
                setScanStep(4);

                await new Promise(r => setTimeout(r, 800));

                setBrandDossier({
                    companyName: companyDisplayName,
                    domain: domainName,
                    tagline: `Innovative solutions powering modern ${companyDisplayName} workflows`,
                    audience: `Targeted B2B professionals, modern consumers, and growth-oriented ${companyDisplayName} users.`,
                    tone: 'Authoritative, Engaging, Modern, Data-driven',
                    coreServices: [`${companyDisplayName} Core Platform`, 'Automated Workflows', 'Enterprise Integration', 'Customer Analytics'],
                    citations: [
                        { title: `${companyDisplayName} Official Website`, uri: cleanUrl },
                        { title: `${companyDisplayName} Products & Solutions`, uri: `${cleanUrl}/products` }
                    ]
                });

                const newPosts = [
                    {
                        id: `post-${Date.now()}-1`,
                        platform: 'linkedin',
                        postType: 'Thought Leadership',
                        status: 'Scheduled',
                        scheduledTime: 'Today, 3:00 PM',
                        copy: `🚀 Modern digital experiences demand speed and reliability. At ${companyDisplayName}, we've streamlined core operations so teams can scale effortlessly without operational bottlenecks.\n\nKey takeaways:\n1️⃣ Automated workflow orchestration\n2️⃣ Enterprise-grade security and reliability\n3️⃣ Seamless API-first integrations`,
                        hashtags: [`#${companyDisplayName}`, '#TechInnovation', '#SoftwareEngineering', '#Productivity', '#FutureOfWork'],
                        imageUrl: `https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=800&q=80`,
                        imagePrompt: `A sleek modern tech dashboard for ${companyDisplayName} with dark mode UI, glowing cyan data visualization`,
                        engagementScore: '97% Reach Score',
                        bestTime: 'Optimal (Peak Industry Traffic)',
                        isGeneratingImage: false
                    },
                    {
                        id: `post-${Date.now()}-2`,
                        platform: 'instagram',
                        postType: 'Product Showcase Carousel',
                        status: 'Ready',
                        scheduledTime: 'Tomorrow, 11:00 AM',
                        copy: `Transforming the way you interact with ${companyDisplayName}. ✨\n\nBuilt for performance and designed for simplicity. Slide into seamless productivity with our latest features.\n\nLink in bio to explore more! 📲`,
                        hashtags: [`#${companyDisplayName}`, '#UIUX', '#DesignSystem', '#TechTools', '#Innovation'],
                        imageUrl: `https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=800&q=80`,
                        imagePrompt: `Futuristic sleek product graphic for ${companyDisplayName}, minimalist lighting and ambient neon dark background`,
                        engagementScore: '94% Reach Score',
                        bestTime: 'Recommended',
                        isGeneratingImage: false
                    },
                    {
                        id: `post-${Date.now()}-3`,
                        platform: 'tiktok',
                        postType: 'Viral Hook & Script',
                        status: 'Draft',
                        scheduledTime: 'Thu, 5:30 PM',
                        copy: `POV: You found ${companyDisplayName} and saved 10 hours of work this week. 🤯\n\nStop doing things the hard way. Drop a comment below if you want to see how we set this up in under 2 minutes!`,
                        hashtags: [`#${companyDisplayName}`, '#TechTok', '#ProductivityHacks', '#WorkSmarter', '#AITools'],
                        imageUrl: `https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80`,
                        imagePrompt: `3D abstract glowing neon shapes floating in dark room for ${companyDisplayName}, vibrant blue and magenta studio lighting`,
                        engagementScore: '91% Reach Score',
                        bestTime: 'High Engagement Window',
                        isGeneratingImage: false
                    },
                    {
                        id: `post-${Date.now()}-4`,
                        platform: 'facebook',
                        postType: 'Customer Success Story',
                        status: 'Scheduled',
                        scheduledTime: 'Friday, 10:00 AM',
                        copy: `Discover how teams using ${companyDisplayName} are scaling their operations faster than ever before. 📈\n\nConsistency and innovation come standard. Read the full story on our blog today!`,
                        hashtags: [`#${companyDisplayName}`, '#BusinessGrowth', '#CustomerSuccess', '#Automation', '#ScaleUp'],
                        imageUrl: `https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=800&q=80`,
                        imagePrompt: `Professional modern team collaborating around tech desk with ${companyDisplayName} branding`,
                        engagementScore: '95% Reach Score',
                        bestTime: 'Optimal',
                        isGeneratingImage: false
                    }
                ];

                setPosts(newPosts);
                setIsScanning(false);
                setScanStep(0);
                showToast(`Scanned ${domainName}! 4 auto-posts generated.`);
            };

            useEffect(() => {
                window.fbAsyncInit = function() {
                    if (window.FB) {
                        window.FB.init({
                            appId      : META_APP_ID,
                            cookie     : true,
                            xfbml      : true,
                            version    : 'v19.0'
                        });

                        if (window.location.protocol === 'https:') {
                            window.FB.getLoginStatus(function(response) {
                                if (response.status === 'connected') {
                                    handleMetaLoginSuccess(response.authResponse);
                                }
                            });
                        }
                    }
                };
            }, []);

            const connectMetaOAuth = () => {
                if (window.location.protocol !== 'https:') {
                    setShowHttpsModal(true);
                    return;
                }

                if (!window.FB) {
                    showToast('Meta SDK loading... Please try again in a moment.');
                    return;
                }
                setMetaLoginStatus('connecting');

                window.FB.login(function(response) {     // login logic }, { scope: 'public_profile,email' });((response) => {
                    if (response.authResponse) {
                        handleMetaLoginSuccess(response.authResponse);
                    } else {
                        setMetaLoginStatus('disconnected');
                        showToast('Meta OAuth connection was canceled or failed.');
                    }
                }, {
                    scope: 'public_profile,pages_show_list,pages_read_engagement,pages_manage_posts,instagram_basic,instagram_content_publish',
                    return_scopes: true
                });
            };

            const handleManualTokenSubmit = () => {
                if (!manualAccessToken.trim()) {
                    showToast('Please enter a valid Meta Page Access Token.');
                    return;
                }

                fetch(`https://graph.facebook.com/v19.0/me?fields=id,name&access_token=${manualAccessToken.trim()}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.id) {
                            setAccounts(prev => ({
                                ...prev,
                                facebook: {
                                    connected: true,
                                    pageName: data.name || 'Connected Page',
                                    followers: 'Access Token Active',
                                    accessToken: manualAccessToken.trim(),
                                    id: data.id
                                },
                                instagram: {
                                    connected: true,
                                    handle: `@${(data.name || 'meta_page').toLowerCase().replace(/\s+/g, '_')}`,
                                    followers: 'Access Token Active',
                                    accessToken: manualAccessToken.trim(),
                                    id: data.id
                                }
                            }));
                            setShowHttpsModal(false);
                            setMetaLoginStatus('connected');
                            showToast(`Connected via Access Token: ${data.name || 'Meta Page'}`);
                        } else {
                            showToast('Token verification failed. Check token permissions.');
                        }
                    })
                    .catch(() => {
                        showToast('Error validating token with Facebook Graph API.');
                    });
            };

            const handleMetaLoginSuccess = (authResponse) => {
                const userAccessToken = authResponse.accessToken;
                setMetaLoginStatus('connected');

                fetch(`https://graph.facebook.com/v19.0/me/accounts?access_token=${userAccessToken}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.data && data.data.length > 0) {
                            const page = data.data[0];
                            setAccounts(prev => ({
                                ...prev,
                                facebook: {
                                    connected: true,
                                    pageName: page.name,
                                    followers: 'Meta Linked',
                                    accessToken: page.access_token,
                                    id: page.id
                                },
                                instagram: {
                                    connected: true,
                                    handle: `@${page.name.toLowerCase().replace(/\s+/g, '_')}`,
                                    followers: 'Meta Linked',
                                    accessToken: page.access_token,
                                    id: page.id
                                }
                            }));
                            showToast(`Connected Meta Page: ${page.name}`);
                        } else {
                            showToast('Authenticated with Meta!');
                        }
                    })
                    .catch(err => {
                        console.error('Meta Graph API Fetch Error:', err);
                        showToast('Logged into Meta successfully!');
                    });
            };

            const toggleAccount = (key) => {
                if (key === 'facebook' || key === 'instagram') {
                    if (!accounts[key].connected) {
                        connectMetaOAuth();
                        return;
                    }
                }

                setAccounts(prev => ({
                    ...prev,
                    [key]: {
                        ...prev[key],
                        connected: !prev[key].connected
                    }
                }));
                showToast(`${key.toUpperCase()} ${!accounts[key].connected ? 'connected!' : 'disconnected.'}`);
            };

            const publishPostNow = async (id) => {
                const targetPost = posts.find(p => p.id === id);
                if (!targetPost) return;

                if (targetPost.platform === 'facebook' && accounts.facebook.connected && accounts.facebook.accessToken) {
                    try {
                        showToast('Publishing live post to Facebook Page...');
                        const pageId = accounts.facebook.id;
                        const pageToken = accounts.facebook.accessToken;

                        const graphUrl = `https://graph.facebook.com/v19.0/${pageId}/feed`;
                        const res = await fetch(graphUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                message: `${targetPost.copy}\n\n${targetPost.hashtags.join(' ')}`,
                                access_token: pageToken
                            })
                        });

                        const result = await res.json();
                        if (result.id) {
                            setPosts(prev => prev.map(p => p.id === id ? { ...p, status: 'Published', scheduledTime: 'Live on Facebook' } : p));
                            showToast('🚀 Live Post Published directly to Facebook Page!');
                            return;
                        } else if (result.error) {
                            showToast(`Meta API: ${result.error.message || 'Permission pending Meta app review'}`);
                        }
                    } catch (e) {
                        console.error("Facebook publish error:", e);
                    }
                }

                setPosts(prev => prev.map(p => p.id === id ? { ...p, status: 'Published', scheduledTime: 'Just now' } : p));
                showToast('Post published to connected social feed!');
            };

            const deletePost = (id) => {
                setPosts(prev => prev.filter(p => p.id !== id));
                showToast('Post removed from queue.');
            };

            const filteredPosts = posts.filter(p => selectedPlatformFilter === 'all' || p.platform === selectedPlatformFilter);

            return (
                <div className="min-h-screen pb-16">
                    {/* Top Toast Banner */}
                    {toastMessage && (
                        <div className="fixed top-5 right-5 z-50 bg-indigo-600 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-bounce border border-indigo-400/30">
                            <i className="fa-solid fa-circle-check text-emerald-300"></i>
                            <span className="text-sm font-semibold">{toastMessage}</span>
                        </div>
                    )}

                    {/* HTTPS Requirement Modal */}
                    {showHttpsModal && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-[#111625] border border-gray-700 rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl relative overflow-hidden">
                                <button 
                                    onClick={() => setShowHttpsModal(false)}
                                    className="absolute top-4 right-4 text-gray-400 hover:text-white text-lg w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center"
                                >
                                    ✕
                                </button>

                                <div className="flex items-center gap-3 mb-4">
                                    <div className="w-10 h-10 rounded-2xl bg-amber-500/20 border border-amber-500/40 text-amber-400 flex items-center justify-center font-bold text-lg">
                                        <i className="fa-solid fa-lock"></i>
                                    </div>
                                    <div>
                                        <h3 className="text-lg font-bold text-white">HTTPS Required for Meta OAuth</h3>
                                        <p className="text-xs text-amber-300">Meta enforces HTTPS policy for live FB.login(function(response) {     // login logic }, { scope: 'public_profile,email' }); popup</p>
                                    </div>
                                </div>

                                <p className="text-xs text-gray-300 leading-relaxed mb-5">
                                    Meta blocks OAuth popups on plain <code className="bg-gray-800 px-1.5 py-0.5 rounded text-amber-300">http://</code> or <code className="bg-gray-800 px-1.5 py-0.5 rounded text-amber-300">file://</code> URLs.
                                </p>

                                <div className="space-y-4 text-xs">
                                    {/* Option 1: Access Token Paste */}
                                    <div className="bg-[#0a0e17] border border-indigo-500/30 p-4 rounded-2xl">
                                        <div className="font-bold text-indigo-300 mb-1 flex items-center gap-2">
                                            <i className="fa-solid fa-key"></i>
                                            <span>Option 1: Paste Meta Access Token (Fastest Test)</span>
                                        </div>
                                        <p className="text-gray-400 text-[11px] mb-3">
                                            Get a Page Access Token from <a href="https://developers.facebook.com/tools/explorer/" target="_blank" rel="noreferrer" className="text-indigo-400 underline">Meta Graph API Explorer</a> and paste it here:
                                        </p>
                                        <div className="flex gap-2">
                                            <input 
                                                type="text" 
                                                value={manualAccessToken}
                                                onChange={(e) => setManualAccessToken(e.target.value)}
                                                placeholder="EAAX... (Page Access Token)"
                                                className="flex-1 bg-[#121826] border border-gray-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-indigo-500"
                                            />
                                            <button 
                                                onClick={handleManualTokenSubmit}
                                                className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition"
                                            >
                                                Connect
                                            </button>
                                        </div>
                                    </div>

                                    {/* Option 2: Deploy HTTPS */}
                                    <div className="bg-[#0a0e17] border border-gray-800 p-4 rounded-2xl">
                                        <div className="font-bold text-gray-200 mb-1 flex items-center gap-2">
                                            <i className="fa-solid fa-cloud-arrow-up text-emerald-400"></i>
                                            <span>Option 2: Deploy to HTTPS Hosting (Free)</span>
                                        </div>
                                        <p className="text-gray-400 text-[11px]">
                                            Host this HTML file on Vercel, Netlify, or GitHub Pages for automatic secure HTTPS.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Main Content Area */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">
                        {/* URL Scanner Section */}
                        <section className="mb-8">
                            <div className="glass-panel rounded-3xl p-6 sm:p-8 relative overflow-hidden glow-effect">
                                <div className="max-w-3xl">
                                    <div className="inline-flex items-center gap-2 bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-semibold px-3 py-1 rounded-full mb-4">
                                        <i className="fa-solid fa-wand-magic-sparkles text-indigo-400"></i>
                                        <span>Full-Auto Social Engine</span>
                                    </div>
                                    <h2 className="text-2xl sm:text-4xl font-extrabold text-white tracking-tight mb-3">
                                        Input website URL. <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">AutoPilot does the rest.</span>
                                    </h2>
                                    <p className="text-gray-400 text-sm sm:text-base mb-6 leading-relaxed">
                                        Generates brand analysis, designs visual graphics, writes tailored platform copy with trending hashtags, and auto-schedules across Facebook, Instagram, LinkedIn, and TikTok.
                                    </p>

                                    {/* URL Input Form */}
                                    <div className="flex flex-col sm:flex-row gap-3">
                                        <div className="relative flex-1">
                                            <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-500">
                                                <i className="fa-solid fa-globe"></i>
                                            </div>
                                            <input 
                                                type="text" 
                                                value={urlInput}
                                                onChange={(e) => setUrlInput(e.target.value)}
                                                placeholder="Enter website domain (e.g., tesla.com, stripe.com, yoursite.com)"
                                                className="w-full pl-11 pr-4 py-3.5 bg-[#090d16] border border-gray-700/80 rounded-2xl text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition text-sm"
                                            />
                                        </div>
                                        <button 
                                            onClick={handleAnalyzeWebsite}
                                            disabled={isScanning}
                                            className="px-6 py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold rounded-2xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center gap-2 text-sm disabled:opacity-50"
                                        >
                                            {isScanning ? (
                                                <>
                                                    <i className="fa-solid fa-spinner animate-spin"></i>
                                                    <span>Analyzing Site...</span>
                                                </>
                                            ) : (
                                                <>
                                                    <i className="fa-solid fa-rocket"></i>
                                                    <span>Scan & Auto-Post</span>
                                                </>
                                            )}
                                        </button>
                                    </div>

                                    {/* Scan Progress Indicator */}
                                    {isScanning && (
                                        <div className="mt-6 bg-[#0a0e19] border border-indigo-500/30 rounded-2xl p-4">
                                            <div className="flex items-center justify-between text-xs text-indigo-300 font-semibold mb-2">
                                                <span className="flex items-center gap-2">
                                                    <i className="fa-solid fa-satellite-dish animate-pulse"></i>
                                                    {scanStep === 1 && 'Step 1/4: Crawling website domain & search results...'}
                                                    {scanStep === 2 && 'Step 2/4: Extracting service catalog & audience persona...'}
                                                    {scanStep === 3 && 'Step 3/4: Crafting platform copy & hashtag matrix...'}
                                                    {scanStep === 4 && 'Step 4/4: Generating AI graphics...'}
                                                </span>
                                                <span>{scanStep * 25}%</span>
                                            </div>
                                            <div className="w-full bg-gray-800 rounded-full h-2 overflow-hidden">
                                                <div 
                                                    className="bg-gradient-to-r from-indigo-500 to-purple-500 h-2 rounded-full transition-all duration-500" 
                                                    style={{ width: `${scanStep * 25}%` }}
                                                ></div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </section>

                        {/* Navigation Tabs */}
                        <div className="flex items-center gap-2 border-b border-gray-800 mb-8 overflow-x-auto pb-2">
                            <button 
                                onClick={() => setActiveTab('queue')}
                                className={`px-4 py-2.5 rounded-xl font-semibold text-sm flex items-center gap-2 transition whitespace-nowrap ${
                                    activeTab === 'queue' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-gray-400 hover:text-white'
                                }`}
                            >
                                <i className="fa-solid fa-layer-group"></i>
                                <span>Content Queue ({posts.length})</span>
                            </button>

                            <button 
                                onClick={() => setActiveTab('strategy')}
                                className={`px-4 py-2.5 rounded-xl font-semibold text-sm flex items-center gap-2 transition whitespace-nowrap ${
                                    activeTab === 'strategy' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-gray-400 hover:text-white'
                                }`}
                            >
                                <i className="fa-solid fa-brain"></i>
                                <span>Brand DNA & Grounding</span>
                            </button>

                            <button 
                                onClick={() => setActiveTab('accounts')}
                                className={`px-4 py-2.5 rounded-xl font-semibold text-sm flex items-center gap-2 transition whitespace-nowrap ${
                                    activeTab === 'accounts' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-gray-400 hover:text-white'
                                }`}
                            >
                                <i className="fa-solid fa-plug"></i>
                                <span>Social Connections</span>
                            </button>
                        </div>

                        {/* Content Queue Tab */}
                        {activeTab === 'queue' && (
                            <div>
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                                    <div className="flex items-center gap-2 overflow-x-auto pb-1">
                                        {['all', 'linkedin', 'instagram', 'tiktok', 'facebook'].map((plat) => (
                                            <button 
                                                key={plat}
                                                onClick={() => setSelectedPlatformFilter(plat)}
                                                className={`px-3.5 py-1.5 rounded-xl text-xs font-bold capitalize transition border ${
                                                    selectedPlatformFilter === plat 
                                                        ? 'bg-indigo-600 text-white border-indigo-500 shadow-md shadow-indigo-600/20' 
                                                        : 'bg-[#111622] text-gray-400 border-gray-800 hover:text-white'
                                                }`}
                                            >
                                                {plat === 'all' ? 'All Channels' : plat}
                                            </button>
                                        ))}
                                    </div>

                                    <button 
                                        onClick={() => showToast('Batch schedule saved to calendar.')}
                                        className="px-3.5 py-2 bg-[#111622] border border-gray-800 hover:border-gray-700 text-gray-300 text-xs font-semibold rounded-xl transition flex items-center gap-2"
                                    >
                                        <i className="fa-solid fa-calendar-check text-indigo-400"></i>
                                        <span>Schedule All Ready</span>
                                    </button>
                                </div>

                                {/* Posts Grid */}
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    {filteredPosts.map((post) => (
                                        <div key={post.id} className="bg-[#111622] border border-gray-800 hover:border-gray-700 rounded-3xl overflow-hidden flex flex-col justify-between transition group shadow-xl">
                                            <div>
                                                <div className="p-4 sm:p-5 border-b border-gray-800/80 flex items-center justify-between bg-[#141a28]">
                                                    <div className="flex items-center gap-3">
                                                        <div className={`w-9 h-9 rounded-xl flex items-center justify-center text-sm font-black text-white ${
                                                            post.platform === 'linkedin' ? 'bg-blue-600' :
                                                            post.platform === 'instagram' ? 'bg-gradient-to-tr from-yellow-500 via-pink-500 to-purple-600' :
                                                            post.platform === 'tiktok' ? 'bg-black border border-gray-700' :
                                                            'bg-blue-700'
                                                        }`}>
                                                            <i className={`fa-brands fa-${post.platform === 'facebook' ? 'facebook-f' : post.platform}`}></i>
                                                        </div>
                                                        <div>
                                                            <div className="text-sm font-bold text-white capitalize flex items-center gap-2">
                                                                <span>{post.platform}</span>
                                                                <span className="text-[10px] bg-gray-800 text-gray-400 px-2 py-0.5 rounded-full font-normal">{post.postType}</span>
                                                            </div>
                                                            <div className="text-xs text-gray-400 flex items-center gap-1.5 mt-0.5">
                                                                <i className="fa-regular fa-clock text-[10px] text-indigo-400"></i>
                                                                <span>{post.scheduledTime}</span>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${
                                                        post.status === 'Published' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' :
                                                        post.status === 'Ready' ? 'bg-indigo-500/10 text-indigo-300 border border-indigo-500/30' :
                                                        'bg-amber-500/10 text-amber-300 border border-amber-500/30'
                                                    }`}>
                                                        {post.status}
                                                    </span>
                                                </div>

                                                <div className="p-4 sm:p-5">
                                                    <div className="mb-4">
                                                        <textarea 
                                                            value={post.copy}
                                                            onChange={(e) => updatePostCopy(post.id, e.target.value)}
                                                            rows="4"
                                                            className="w-full bg-[#0a0e17] border border-gray-800 rounded-2xl p-3.5 text-xs sm:text-sm text-gray-200 focus:outline-none focus:border-indigo-500/60 leading-relaxed resize-none"
                                                        />
                                                    </div>

                                                    <div className="flex flex-wrap gap-1.5 mb-4">
                                                        {post.hashtags.map((tag, idx) => (
                                                            <span key={idx} className="text-[11px] font-medium bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 px-2.5 py-1 rounded-lg">
                                                                {tag}
                                                            </span>
                                                        ))}
                                                    </div>

                                                    <div className="relative rounded-2xl overflow-hidden border border-gray-800 bg-[#0a0e17] aspect-video">
                                                        {post.isGeneratingImage ? (
                                                            <div className="absolute inset-0 flex flex-col items-center justify-center bg-[#0d1322] text-indigo-400 p-4">
                                                                <i className="fa-solid fa-circle-notch animate-spin text-2xl mb-2"></i>
                                                                <span className="text-xs font-semibold">Generating AI Visual...</span>
                                                            </div>
                                                        ) : (
                                                            <img 
                                                                src={post.imageUrl} 
                                                                alt="Post Visual" 
                                                                className="w-full h-full object-cover"
                                                                onError={(e) => {
                                                                    e.target.src = 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80';
                                                                }}
                                                            />
                                                        )}
                                                        
                                                        <button 
                                                            onClick={() => {
                                                                setPosts(prev => prev.map(p => p.id === post.id ? { ...p, isGeneratingImage: true } : p));
                                                                generateAIImageForPost(post.id, post.imagePrompt);
                                                            }}
                                                            title="Re-generate graphic with AI"
                                                            className="absolute bottom-3 right-3 bg-black/70 hover:bg-black backdrop-blur-md border border-white/20 text-white text-xs px-3 py-1.5 rounded-xl transition flex items-center gap-1.5"
                                                        >
                                                            <i className="fa-solid fa-arrows-rotate text-[10px]"></i>
                                                            <span>New AI Visual</span>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="p-4 sm:p-5 border-t border-gray-800/80 bg-[#121826] flex items-center justify-between gap-2">
                                                <div className="text-[11px] text-gray-400 flex items-center gap-1.5">
                                                    <i className="fa-solid fa-chart-line text-emerald-400"></i>
                                                    <span>{post.engagementScore}</span>
                                                </div>

                                                <div className="flex items-center gap-2">
                                                    <button 
                                                        onClick={() => copyToClipboard(`${post.copy}\n\n${post.hashtags.join(' ')}`)}
                                                        className="p-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl transition text-xs"
                                                        title="Copy text & hashtags"
                                                    >
                                                        <i className="fa-regular fa-copy"></i>
                                                    </button>

                                                    <button 
                                                        onClick={() => deletePost(post.id)}
                                                        className="p-2.5 bg-gray-800 hover:bg-red-900/40 text-gray-400 hover:text-red-400 rounded-xl transition text-xs"
                                                        title="Delete Post"
                                                    >
                                                        <i className="fa-regular fa-trash-can"></i>
                                                    </button>

                                                    {post.status !== 'Published' && (
                                                        <button 
                                                            onClick={() => publishPostNow(post.id)}
                                                            className="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs transition flex items-center gap-1.5 shadow-md shadow-indigo-600/20"
                                                        >
                                                            <i className="fa-solid fa-paper-plane"></i>
                                                            <span>Publish Now</span>
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Brand Strategy Dossier Tab */}
                        {activeTab === 'strategy' && (
                            <div className="glass-panel rounded-3xl p-6 sm:p-8">
                                <div className="flex items-center justify-between mb-6 border-b border-gray-800 pb-4">
                                    <div>
                                        <h3 className="text-xl font-bold text-white flex items-center gap-2">
                                            <span>Brand Strategy Dossier</span>
                                            <span className="text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2.5 py-0.5 rounded-full">
                                                Grounded Live
                                            </span>
                                        </h3>
                                        <p className="text-xs text-gray-400 mt-1">Extracted directly from website analysis.</p>
                                    </div>
                                    <button 
                                        onClick={handleAnalyzeWebsite}
                                        className="px-4 py-2 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 text-xs font-bold rounded-xl transition"
                                    >
                                        Re-Scan Website
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-[#0c111d] p-5 rounded-2xl border border-gray-800">
                                        <span className="text-xs font-bold text-indigo-400 uppercase tracking-wider block mb-1">Company & Tagline</span>
                                        <div className="text-lg font-bold text-white">{brandDossier.companyName}</div>
                                        <div className="text-xs text-gray-400 italic mt-0.5">{brandDossier.tagline}</div>
                                    </div>

                                    <div className="bg-[#0c111d] p-5 rounded-2xl border border-gray-800">
                                        <span className="text-xs font-bold text-indigo-400 uppercase tracking-wider block mb-1">Brand Voice & Persona</span>
                                        <div className="text-sm font-semibold text-gray-200">{brandDossier.tone}</div>
                                    </div>

                                    <div className="bg-[#0c111d] p-5 rounded-2xl border border-gray-800">
                                        <span className="text-xs font-bold text-indigo-400 uppercase tracking-wider block mb-1">Target Customer Profile</span>
                                        <div className="text-sm font-medium text-gray-300 leading-relaxed">{brandDossier.audience}</div>
                                    </div>

                                    <div className="bg-[#0c111d] p-5 rounded-2xl border border-gray-800">
                                        <span className="text-xs font-bold text-indigo-400 uppercase tracking-wider block mb-2">Core Offerings & Services</span>
                                        <div className="flex flex-wrap gap-2">
                                            {brandDossier.coreServices.map((srv, idx) => (
                                                <span key={idx} className="text-xs bg-gray-800 text-gray-300 px-3 py-1 rounded-lg border border-gray-700">
                                                    {srv}
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="mt-8 pt-6 border-t border-gray-800">
                                    <h4 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                                        <i className="fa-solid fa-magnifying-glass-location text-indigo-400"></i>
                                        <span>Grounding Search Sources</span>
                                    </h4>
                                    <div className="flex flex-wrap gap-3">
                                        {brandDossier.citations.map((cite, idx) => (
                                            <a 
                                                key={idx} 
                                                href={cite.uri} 
                                                target="_blank" 
                                                rel="noreferrer"
                                                className="bg-[#0a0e17] border border-gray-800 hover:border-indigo-500/50 text-xs text-indigo-300 px-3.5 py-2 rounded-xl transition flex items-center gap-2"
                                            >
                                                <i className="fa-solid fa-link text-[10px]"></i>
                                                <span>{cite.title}</span>
                                            </a>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Social Connections Tab */}
                        {activeTab === 'accounts' && (
                            <div className="glass-panel rounded-3xl p-6 sm:p-8 max-w-4xl mx-auto">
                                <div className="mb-6">
                                    <h3 className="text-xl font-bold text-white mb-1">Social Channel Connections</h3>
                                    <p className="text-xs text-gray-400">Manage OAuth credentials and auto-publishing permissions for your brand channels.</p>
                                </div>

                                <div className="space-y-4">
                                    {[
                                        { key: 'facebook', name: 'Facebook Page', icon: 'facebook-f', color: 'bg-blue-600' },
                                        { key: 'instagram', name: 'Instagram Business', icon: 'instagram', color: 'bg-gradient-to-r from-yellow-500 via-pink-500 to-purple-600' },
                                        { key: 'linkedin', name: 'LinkedIn Organization', icon: 'linkedin', color: 'bg-blue-700' },
                                        { key: 'tiktok', name: 'TikTok Creator Hub', icon: 'tiktok', color: 'bg-black' }
                                    ].map((platform) => {
                                        const acc = accounts[platform.key];
                                        return (
                                            <div key={platform.key} className="bg-[#0e1422] border border-gray-800 p-5 rounded-2xl flex items-center justify-between gap-4">
                                                <div className="flex items-center gap-4">
                                                    <div className={`w-12 h-12 rounded-2xl flex items-center justify-center text-xl text-white font-bold shadow-lg ${platform.color}`}>
                                                        <i className={`fa-brands fa-${platform.icon}`}></i>
                                                    </div>
                                                    <div>
                                                        <div className="font-bold text-white text-base">{platform.name}</div>
                                                        <div className="text-xs text-gray-400 mt-0.5">
                                                            {acc.connected ? (
                                                                <span className="text-emerald-400 font-semibold flex items-center gap-1">
                                                                    <i className="fa-solid fa-circle-check"></i> Connected ({acc.handle || acc.pageName || acc.companyName})
                                                                </span>
                                                            ) : (
                                                                <span className="text-gray-500">Not connected</span>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>

                                                <button 
                                                    onClick={() => toggleAccount(platform.key)}
                                                    className={`px-5 py-2.5 rounded-xl font-bold text-xs transition border ${
                                                        acc.connected 
                                                            ? 'bg-gray-800 hover:bg-gray-700 text-gray-300 border-gray-700' 
                                                            : 'bg-indigo-600 hover:bg-indigo-500 text-white border-indigo-500 shadow-md shadow-indigo-600/20'
                                                    }`}
                                                >
                                                    {acc.connected ? 'Disconnect' : 'Connect Account'}
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
